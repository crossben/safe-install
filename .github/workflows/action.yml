name: action

# The GitHub Action must fail on a seeded malicious dependency and pass on a clean project.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  seeded-bad-dependency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: check
        uses: ./
        continue-on-error: true
        with:
          working-directory: testdata/action/bad
          version: source # tests this commit; releases are covered by the default "latest"
      - name: Expect failure
        env:
          OUTCOME: ${{ steps.check.outcome }}
          CODE: ${{ steps.check.outputs.exit-code }}
        run: |
          echo "outcome=$OUTCOME exit-code=$CODE"
          test "$OUTCOME" = failure && test "$CODE" = 1
      - name: Expect a summary naming the package
        run: grep -q '^| ' "$RUNNER_TEMP/safe-install.md" && grep -q '<!-- safe-install-report -->' "$RUNNER_TEMP/safe-install.md"

  seeded-bad-python-dependency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: check
        uses: ./
        continue-on-error: true
        with:
          working-directory: testdata/action/python-bad
          version: source
      - name: Expect failure
        env:
          OUTCOME: ${{ steps.check.outcome }}
          CODE: ${{ steps.check.outputs.exit-code }}
        run: |
          echo "outcome=$OUTCOME exit-code=$CODE"
          test "$OUTCOME" = failure && test "$CODE" = 1

  clean-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./
        with:
          working-directory: testdata/action/clean
          version: source
